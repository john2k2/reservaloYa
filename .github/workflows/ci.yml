name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project check
        run: npm run check

  coverage-thresholds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 3


  # Manual post-deploy smoke check against the real production URL.
  # Not a merge gate — see e2e-smoke-pr below for the automated pre-merge gate.
  e2e-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run smoke E2E
        env:
          PLAYWRIGHT_BASE_URL: https://reservaya.ar
        run: npm run test:e2e:smoke

  # Automated pre-merge gate: runs the public smoke suite against a local
  # build backed by a local Supabase instance (CLI + Docker), so the golden
  # path (public pages, admin login page) is checked on every PR without
  # depending on an external staging project or extra GitHub secrets.
  e2e-smoke-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Start local Supabase
        run: npx supabase start

      - name: Export local Supabase credentials
        run: |
          npx supabase status -o env > /tmp/supabase-status.env
          ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '"')
          SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '"')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "Could not read ANON_KEY/SERVICE_ROLE_KEY from 'supabase status -o env'" >&2
            cat /tmp/supabase-status.env >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          # NODE_ENV=development under `npm run dev` (what Playwright's webServer
          # spawns for a localhost baseURL) — this opts into the dev-only fallback
          # for BOOKING_LINK_SECRET/CSRF_SECRET instead of requiring them explicitly.
          echo "ALLOW_DEV_SECRETS=1" >> "$GITHUB_ENV"

      - name: Run public smoke E2E against local build
        run: npm run test:e2e:smoke

